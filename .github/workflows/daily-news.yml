name: Daily News

on:
  schedule:
    # 毎日 2:47 JST（cron は UTC）
    # 毎時 0 分は GitHub の schedule が集中して遅れや飛ばしが起きやすいので避ける。
    # 深夜にしておけば、遅れても朝までに公開が終わり、失敗しても朝に手動で再実行できる
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "その日の News があっても上書きして取り直す（ピックアップも作り直す）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-news
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: News を取得する
        # schedule の実行では inputs.force が空になり、上書きしない
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 scripts/news/fetch_ai_news.py --force
          else
            python3 scripts/news/fetch_ai_news.py
          fi

      # 失敗してもピックアップなしの News を公開するため、ここでは止めず最後のステップで失敗にする
      - name: Workers AI でピックアップを作る
        id: curate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/news/curate_news.py

      - name: source ごとの件数をサマリーに出す
        run: |
          file="src/content/news/$(date +%Y%m%d)/index.md"
          if [ ! -f "$file" ]; then
            echo "News のファイルがありません: $file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## source ごとの件数（$(date +%Y-%m-%d)）"
            echo ""
            echo "| source | 件数 |"
            echo "|---|---|"
            # 見出し「## <source>（...）」ごとに、番号が数字の行（記事）を数える。ピックアップの節は source ではないので数えない
            awk '
              /^## / { if (name != "") print "| " name " | " count " |"; name = substr($0, 4); sub(/（.*/, "", name); if (name == "今日のピックアップ") name = ""; count = 0; next }
              /^\| [0-9]+ \|/ { count++ }
              END { if (name != "") print "| " name " | " count " |" }
            ' "$file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 差分があれば PR を作って merge する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- src/content/news)" ]; then
            echo "差分が無いため PR を作りません"
            exit 0
          fi
          date=$(date +%Y%m%d)
          branch="news/$date"
          title="chore: $date の News を追加する"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- src/content/news
          git commit -m "$title"
          # 前回の失敗でブランチが残っていても再実行できるように上書きする
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "$title" --body "workflow（Daily News）が自動で作成した PR です。"
          gh pr merge "$branch" --squash --delete-branch

      - name: キュレーションの失敗を workflow の失敗にする
        if: steps.curate.outcome == 'failure'
        run: |
          echo "::error::ピックアップを作れなかったため、表だけの News を公開しました。ログの「Workers AI でピックアップを作る」を確認してください"
          exit 1
