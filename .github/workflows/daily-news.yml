name: Daily News

on:
  # 定期実行は workers/daily-news-trigger の Cron Triggers から起動する。
  workflow_dispatch:
    inputs:
      force:
        description: "その日の News があっても上書きして取り直す（ピックアップも作り直す）"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-news
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: JST の対象日を固定する
        run: echo "NEWS_DATE=$(date +%Y%m%d)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: News を取得する
        # Cron Triggers からは force=false、手動実行では指定した値を受け取る。
        env:
          FORCE: ${{ inputs.force }}
          # Qiita API のいいね数を取る。未登録でも動くが、認証なしの上限（ 1 時間 60 回）に届くと「—」になる
          QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python3 scripts/news/fetch_ai_news.py --date "$NEWS_DATE" --force
          else
            python3 scripts/news/fetch_ai_news.py --date "$NEWS_DATE"
          fi

      # 失敗してもピックアップなしの News を公開するため、ここでは止めず最後のステップで失敗にする
      - name: Workers AI でピックアップを作る
        id: curate
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/news/curate_news.py --date "$NEWS_DATE"

      - name: source ごとの件数をサマリーに出す
        run: |
          file="src/content/news/$NEWS_DATE/index.md"
          if [ ! -f "$file" ]; then
            echo "News のファイルがありません: $file" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## source ごとの件数（${NEWS_DATE:0:4}-${NEWS_DATE:4:2}-${NEWS_DATE:6:2}）"
            echo ""
            echo "| source | 件数 |"
            echo "|---|---|"
            # 見出し「## <source>（...）」ごとに、番号が数字の行（記事）を数える。ピックアップの節は source ではないので数えない
            awk '
              /^## / { if (name != "") print "| " name " | " count " |"; name = substr($0, 4); sub(/（.*/, "", name); if (name == "今日のピックアップ") name = ""; count = 0; next }
              /^\| [0-9]+ \|/ { count++ }
              END { if (name != "") print "| " name " | " count " |" }
            ' "$file"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 差分があれば PR を作って merge する
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- src/content/news)" ]; then
            echo "差分が無いため PR を作りません"
            exit 0
          fi
          branch="news/$NEWS_DATE"
          title="chore: $NEWS_DATE の News を追加する"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- src/content/news
          git commit -m "$title"
          # 前回の失敗でブランチが残っていても再実行できるように上書きする
          git push --force origin "$branch"
          if ! pr_number=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty'); then
            echo "::error::既存 PR の取得に失敗しました"
            exit 1
          fi
          if [ -z "$pr_number" ]; then
            if ! gh pr create --base main --head "$branch" --title "$title" --body "workflow（Daily News）が自動で作成した PR です。"; then
              echo "::error::PR の作成に失敗しました"
              exit 1
            fi
          else
            echo "既存 PR #$pr_number を再利用します"
          fi
          gh pr merge "$branch" --squash --delete-branch

      - name: キュレーションの失敗を workflow の失敗にする
        if: steps.curate.outcome == 'failure'
        run: |
          echo "::error::ピックアップを作れなかったため、表だけの News を公開しました。ログの「Workers AI でピックアップを作る」を確認してください"
          exit 1
